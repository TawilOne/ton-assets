<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>Статистика бота</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  :root {
    --bg: #000; --surface: #0f0f11; --surface-2: #17171a; --line: rgba(255,255,255,.08);
    --text: #f5f5f7; --muted: #8a8a93; --faint: #5a5a63; --red: #ff3030; --bar: #3d8bff; --radius: 20px;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { background: var(--bg); }
  body { margin: 0; color: var(--text); font: 15px/1.45 Inter, -apple-system, system-ui, sans-serif;
         padding: max(16px, env(safe-area-inset-top)) 16px max(24px, env(safe-area-inset-bottom));
         background: radial-gradient(600px 300px at 85% -60px, rgba(61,139,255,.14), transparent 70%), var(--bg); }
  h1 { margin: 2px 0 2px; font-size: 28px; font-weight: 800; letter-spacing: -.03em; }
  .eyebrow { color: var(--muted); font-size: 13px; }
  .card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 16px; margin-top: 12px; }
  .card h2 { margin: 0 0 12px; font-size: 16px; font-weight: 700; display: flex; justify-content: space-between; align-items: baseline; }
  .card h2 span { color: var(--muted); font-size: 12px; font-weight: 500; }
  .kpis { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 14px; }
  .kpi { background: var(--surface); border: 1px solid var(--line); border-radius: 18px; padding: 12px 14px; }
  .kpi b { display: block; font-size: 28px; font-weight: 800; letter-spacing: -.03em; font-variant-numeric: tabular-nums; }
  .kpi small { color: var(--muted); font-size: 12px; }

  /* график по дням: один ряд — без легенды, подписи текстом */
  .chart { position: relative; height: 150px; display: flex; align-items: flex-end; gap: 2px; padding-top: 18px; }
  .col { flex: 1; height: 100%; display: flex; align-items: flex-end; position: relative; cursor: default; }
  .col i { display: block; width: 100%; background: var(--bar); border-radius: 4px 4px 0 0; min-height: 2px; }
  .col.zero i { background: #26262c; }
  .col:hover i, .col.on i { filter: brightness(1.25); }
  .axis { display: flex; justify-content: space-between; color: var(--faint); font-size: 11px; margin-top: 6px;
          border-top: 1px solid var(--line); padding-top: 6px; font-variant-numeric: tabular-nums; }
  .tip { position: absolute; top: 0; transform: translateX(-50%); background: #22222a; border: 1px solid var(--line);
         border-radius: 8px; padding: 3px 8px; font-size: 12px; white-space: nowrap; pointer-events: none; display: none; }
  .tip b { font-variant-numeric: tabular-nums; }

  /* кнопки: горизонтальные полосы одного цвета, значения текстом */
  .bars { display: grid; gap: 8px; }
  .brow { display: grid; grid-template-columns: 112px 1fr 40px; align-items: center; gap: 8px; font-size: 13px; }
  .brow .track { height: 10px; background: #1b1b20; border-radius: 0 4px 4px 0; overflow: hidden; }
  .brow .track i { display: block; height: 100%; background: var(--bar); border-radius: 0 4px 4px 0; }
  .brow .n { text-align: right; color: var(--muted); font-variant-numeric: tabular-nums; }

  /* пользователи */
  .search { width: 100%; background: var(--surface-2); border: 1px solid var(--line); border-radius: 12px;
            color: var(--text); font: inherit; padding: 9px 12px; outline: none; margin-bottom: 8px; }
  .sort { display: flex; gap: 6px; margin-bottom: 8px; }
  .sort button { flex: 1; -webkit-appearance: none; appearance: none; border: 1px solid var(--line); border-radius: 10px;
                 background: var(--surface-2); color: var(--muted); font: 600 12px Inter, system-ui, sans-serif; padding: 7px 4px; }
  .sort button.on { background: #fff; color: #000; border-color: #fff; }
  .user { display: grid; grid-template-columns: 34px 1fr auto; gap: 10px; align-items: center; padding: 9px 0;
          border-top: 1px solid var(--line); }
  .user:first-of-type { border-top: 0; }
  .ava { width: 34px; height: 34px; border-radius: 50%; background: #23232a; display: grid; place-items: center;
         font-weight: 700; font-size: 14px; color: #cfcfd6; position: relative; }
  .ava.live::after { content: ""; position: absolute; right: -1px; bottom: -1px; width: 10px; height: 10px; border-radius: 50%;
                     background: #34c759; border: 2px solid var(--surface); }
  .who { min-width: 0; }
  .who b { display: block; font-size: 14px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .who small { display: block; color: var(--muted); font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .clicks { text-align: right; }
  .clicks b { display: block; font-size: 17px; font-weight: 700; font-variant-numeric: tabular-nums; }
  .clicks small { color: var(--muted); font-size: 11px; }
  .more { width: 100%; margin-top: 8px; -webkit-appearance: none; appearance: none; border: 1px solid var(--line);
          border-radius: 12px; background: var(--surface-2); color: var(--text); font: 600 13px Inter, system-ui, sans-serif; padding: 10px; }
  .empty { color: var(--muted); text-align: center; padding: 30px 0; }
</style>
</head>
<body>
<div class="eyebrow" id="updated">Статистика</div>
<h1>Пользователи бота</h1>
<div id="app"><div class="empty">Загружаю…</div></div>

<script>
const tg = window.Telegram && window.Telegram.WebApp;
if (tg) { tg.ready(); tg.expand(); try { tg.setHeaderColor("#000000"); tg.setBackgroundColor("#000000"); } catch (e) {} }

const ACTIONS = { today: "📅 Сегодня", tomorrow: "➡️ Завтра", week: "🗓 Неделя", next: "⏭ След. неделя",
                  map: "🗺 Где пара", digest: "⏰ Рассылка", settings: "⚙️ Настройки", start: "/start",
                  date: "/date", export: "/all", captcha: "/captcha", other: "Другое" };
const FLAGS = { ru: "🇷🇺", en: "🇬🇧", fr: "🇫🇷" };
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const plural = (n, a, b, c) => { const x = n % 10, y = n % 100; return x === 1 && y !== 11 ? a : x >= 2 && x <= 4 && (y < 12 || y > 14) ? b : c; };

// данные приходят от бота в части адреса после «#»: сжатый JSON (deflate) в base64url
async function load() {
  const h = location.hash.slice(1);
  if (!h) return null;
  const b64 = h.replace(/-/g, "+").replace(/_/g, "/") + "===".slice((h.length + 3) % 4);
  const bytes = Uint8Array.from(atob(b64), c => c.charCodeAt(0));
  const stream = new Blob([bytes]).stream().pipeThrough(new DecompressionStream("deflate-raw"));
  return JSON.parse(await new Response(stream).text());
}

const parseTs = s => s ? new Date(s.replace(" ", "T") + ":00") : null;  // «2026-10-15 09:12», время Москвы
function ago(last, now) {
  const a = parseTs(last), b = parseTs(now);
  if (!a || !b) return "—";
  const m = Math.max(0, Math.round((b - a) / 60000));
  if (m < 1) return "только что";
  if (m < 60) return `${m} мин назад`;
  const h = Math.round(m / 60);
  if (h < 24) return `${h} ч назад`;
  const d = Math.round(h / 24);
  return `${d} ${plural(d, "день", "дня", "дней")} назад`;
}
const dayKey = d => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`;
const shortDay = k => `${+k.slice(8, 10)}.${k.slice(5, 7)}`;

let users = [], nowStr = "", sortBy = "last", query = "", shown = 30;

function render() {
  const now = parseTs(nowStr), today = nowStr.slice(0, 10);
  // последние 14 дней
  const days = [];
  for (let i = 13; i >= 0; i--) { const d = new Date(now); d.setDate(d.getDate() - i); days.push(dayKey(d)); }
  const perDay = Object.fromEntries(days.map(k => [k, { clicks: 0, users: 0 }]));
  const acts = {};
  let week = 0;
  for (const u of users) {
    for (const [k, n] of Object.entries(u.days)) if (perDay[k]) { perDay[k].clicks += n; perDay[k].users++; }
    for (const [a, n] of Object.entries(u.acts)) acts[a] = (acts[a] || 0) + n;
  }
  for (const k of days.slice(-7)) week += perDay[k].clicks;
  const activeToday = users.filter(u => u.last.startsWith(today)).length;
  const active7 = users.filter(u => u.last >= days[7]).length;
  const newWeek = users.filter(u => u.first >= days[7]).length;
  const maxDay = Math.max(1, ...days.map(k => perDay[k].clicks));

  const actRows = Object.entries(acts).sort((a, b) => b[1] - a[1]);
  const maxAct = Math.max(1, ...actRows.map(r => r[1]));

  let list = users.filter(u => !query || (u.name + " " + u.username).toLowerCase().includes(query));
  list.sort(sortBy === "clicks" ? (a, b) => b.count - a.count : sortBy === "new" ? (a, b) => b.first.localeCompare(a.first)
                                : (a, b) => b.last.localeCompare(a.last));

  document.getElementById("app").innerHTML = `
    <div class="kpis">
      <div class="kpi"><b>${users.length}</b><small>всего пользователей</small></div>
      <div class="kpi"><b>${activeToday}</b><small>активны сегодня</small></div>
      <div class="kpi"><b>${perDay[today] ? perDay[today].clicks : 0}</b><small>кликов сегодня</small></div>
      <div class="kpi"><b>${active7}</b><small>активны за 7 дней · новых ${newWeek}</small></div>
    </div>

    <div class="card">
      <h2>Клики по дням <span>${week} за 7 дней</span></h2>
      <div class="chart" id="chart">
        ${days.map(k => { const v = perDay[k].clicks; return `<div class="col ${v ? "" : "zero"}" data-k="${k}">
          <i style="height:${Math.max(2, v / maxDay * 100)}%"></i></div>`; }).join("")}
        <div class="tip" id="tip"></div>
      </div>
      <div class="axis"><span>${shortDay(days[0])}</span><span>${shortDay(days[7])}</span><span>сегодня</span></div>
    </div>

    <div class="card">
      <h2>Что нажимают <span>за всё время</span></h2>
      ${actRows.length ? `<div class="bars">${actRows.map(([a, n]) => `<div class="brow"><span>${esc(ACTIONS[a] || a)}</span>
        <div class="track"><i style="width:${n / maxAct * 100}%"></i></div><span class="n">${n}</span></div>`).join("")}</div>`
        : `<div class="empty">Появится после обновления бота — с этого момента он считает нажатия по кнопкам</div>`}
    </div>

    <div class="card">
      <h2>Пользователи <span>${list.length}</span></h2>
      <input class="search" id="q" placeholder="Поиск по имени или @нику" value="${esc(query)}">
      <div class="sort">
        <button data-s="last" class="${sortBy === "last" ? "on" : ""}">Недавние</button>
        <button data-s="clicks" class="${sortBy === "clicks" ? "on" : ""}">Больше кликов</button>
        <button data-s="new" class="${sortBy === "new" ? "on" : ""}">Новые</button>
      </div>
      ${list.slice(0, shown).map(u => {
        const initial = (u.name || u.username || "?").trim()[0].toUpperCase();
        const meta = [u.username ? "@" + u.username : "", ago(u.last, nowStr),
                      u.sub ? "⏰ " + u.sub : "", FLAGS[u.lang] && u.lang !== "ru" ? FLAGS[u.lang] : ""].filter(Boolean).join(" · ");
        return `<div class="user"><div class="ava ${u.last.startsWith(today) ? "live" : ""}">${esc(initial)}</div>
          <div class="who"><b>${esc(u.name || "без имени")}</b><small>${esc(meta)}</small></div>
          <div class="clicks"><b>${u.count}</b><small>${plural(u.count, "клик", "клика", "кликов")}</small></div></div>`;
      }).join("") || `<div class="empty">Никого не нашлось</div>`}
      ${list.length > shown ? `<button class="more" id="more">Показать ещё ${list.length - shown}</button>` : ""}
    </div>`;

  // подсказка над столбиком
  const tip = document.getElementById("tip"), chart = document.getElementById("chart");
  chart.querySelectorAll(".col").forEach(col => {
    const show = () => {
      chart.querySelectorAll(".col.on").forEach(c => c.classList.remove("on"));
      col.classList.add("on");
      const k = col.dataset.k, v = perDay[k];
      tip.innerHTML = `${shortDay(k)} · <b>${v.clicks}</b> ${plural(v.clicks, "клик", "клика", "кликов")} · ${v.users} чел.`;
      tip.style.display = "block";
      const left = col.offsetLeft + col.offsetWidth / 2;
      tip.style.left = Math.min(Math.max(left, tip.offsetWidth / 2), chart.clientWidth - tip.offsetWidth / 2) + "px";
    };
    col.onmouseenter = show; col.onclick = show;
  });
  chart.onmouseleave = () => { tip.style.display = "none"; chart.querySelectorAll(".col.on").forEach(c => c.classList.remove("on")); };

  const q = document.getElementById("q");
  q.oninput = () => { query = q.value.trim().toLowerCase(); shown = 30; render(); const q2 = document.getElementById("q"); q2.focus(); q2.setSelectionRange(q2.value.length, q2.value.length); };
  document.querySelectorAll(".sort button").forEach(b => b.onclick = () => { sortBy = b.dataset.s; shown = 30; render(); });
  const more = document.getElementById("more");
  if (more) more.onclick = () => { shown += 50; render(); };
}

load().then(data => {
  if (!data) { document.getElementById("app").innerHTML = `<div class="empty">Откройте статистику кнопкой из бота (/users)</div>`; return; }
  nowStr = data.now;
  document.getElementById("updated").textContent = `Обновлено ${data.now.slice(8, 10)}.${data.now.slice(5, 7)} в ${data.now.slice(11)}`;
  users = data.u.map(r => ({ name: r[0], username: r[1], count: r[2], first: r[3] || "", last: r[4] || "", lang: r[5],
                             sub: r[6], acts: r[7] || {}, days: r[8] || {} }));
  render();
}).catch(() => {
  document.getElementById("app").innerHTML = `<div class="empty">Не удалось прочитать данные. Откройте /users ещё раз.</div>`;
});
</script>
</body>
</html>
