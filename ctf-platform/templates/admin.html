{% extends "base.html" %}{% block title %}Админка{% endblock %}
{% block content %}
<div class="head spread"><h1>Задания</h1><a class="btn primary" href="{{ url_for('admin_edit') }}">+ Новое задание</a></div>
<div class="card table-wrap">
<table>
  <thead><tr><th>Название</th><th>Категория</th><th>Сложность</th><th>Очки</th><th>Решений</th><th></th></tr></thead>
  <tbody>
  {% for c in chals %}
  <tr class="{{ 'dim' if not c.visible }}"><td><a href="{{ url_for('challenge', slug=c.slug) }}">{{ c.title }}</a></td><td>{{ c.cat_name }}</td><td><span class="badge {{ c.difficulty }}">{{ DIFF[c.difficulty] }}</span></td><td class="mono">{{ c.points }}</td><td class="mono">{{ c.solves }}</td><td><a href="{{ url_for('admin_edit', cid=c.id) }}">Изменить</a></td></tr>
  {% endfor %}
  </tbody>
</table>
</div>
{% endblock %}
