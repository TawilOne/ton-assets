{% extends "base.html" %}{% block title %}Рейтинг{% endblock %}
{% block content %}
<h1>Рейтинг</h1>
<div class="card table-wrap">
<table>
  <thead><tr><th>#</th><th>Игрок</th><th>Решено</th><th>Очки</th></tr></thead>
  <tbody>
  {% for r in rows %}
  <tr><td class="mono rank">{{ loop.index }}</td><td><a href="{{ url_for('profile', username=r.username) }}">{{ r.username }}</a></td><td class="mono">{{ r.solved }}</td><td class="mono accent">{{ r.score }}</td></tr>
  {% else %}<tr><td colspan="4" class="muted">Пока пусто.</td></tr>{% endfor %}
  </tbody>
</table>
</div>
{% endblock %}
