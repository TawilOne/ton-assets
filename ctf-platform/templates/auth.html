{% extends "base.html" %}{% block title %}{{ 'Вход' if mode == 'login' else 'Регистрация' }}{% endblock %}
{% block content %}
<div class="card auth">
  <h1>{{ 'Вход' if mode == 'login' else 'Регистрация' }}</h1>
  <form method="post">
    <input type="hidden" name="csrf" value="{{ csrf }}">
    <label>Ник<input name="username" required autocomplete="username"></label>
    <label>Пароль<input name="password" type="password" required autocomplete="{{ 'current-password' if mode == 'login' else 'new-password' }}"></label>
    <button class="btn primary block">{{ 'Войти' if mode == 'login' else 'Создать аккаунт' }}</button>
  </form>
  <p class="muted small">{% if mode == 'login' %}Нет аккаунта? <a href="{{ url_for('register') }}">Регистрация</a>{% else %}Уже есть аккаунт? <a href="{{ url_for('login') }}">Войти</a>{% endif %}</p>
</div>
{% endblock %}
