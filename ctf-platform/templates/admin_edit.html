{% extends "base.html" %}{% block title %}Редактор{% endblock %}
{% block content %}
<h1>{{ 'Изменить задание' if ch and ch.id else 'Новое задание' }}</h1>
<form method="post" enctype="multipart/form-data" class="card form">
  <input type="hidden" name="csrf" value="{{ csrf }}">
  <label>Название<input name="title" required value="{{ ch.title if ch }}"></label>
  <label>Slug (часть URL)<input name="slug" required pattern="[a-z0-9-]+" value="{{ ch.slug if ch }}"></label>
  <div class="cols">
    <label>Категория<select name="category_id">{% for c in cats %}<option value="{{ c.id }}" {{ 'selected' if ch and ch.category_id|string == c.id|string }}>{{ c.name }}</option>{% endfor %}</select></label>
    <label>Сложность<select name="difficulty">{% for k, v in DIFF.items() %}<option value="{{ k }}" {{ 'selected' if ch and ch.difficulty == k }}>{{ v }}</option>{% endfor %}</select></label>
    <label>Очки<input name="points" type="number" min="0" required value="{{ ch.points if ch else 100 }}"></label>
  </div>
  <label>Описание<textarea name="description" rows="8" required>{{ ch.description if ch }}</textarea></label>
  <label>Адрес / IP (необязательно)<input name="address" value="{{ ch.address if ch }}" placeholder="10.10.0.5 или http://..."></label>
  <label>Файл {% if ch and ch.attachment %}<span class="muted">(сейчас: {{ ch.attachment }})</span>{% endif %}<input name="attachment" type="file"></label>
  <label>Флаг {% if ch and ch.id %}<span class="muted">(пусто — оставить прежний)</span>{% endif %}<input name="flag" class="mono" placeholder="FLAG{...}"></label>
  <label class="check"><input type="checkbox" name="visible" {{ 'checked' if not ch or ch.visible }}> Опубликовано</label>
  <div class="spread">
    <button class="btn primary">Сохранить</button>
    {% if ch and ch.id %}<button class="btn danger" name="delete" value="1" onclick="return confirm('Удалить задание?')">Удалить</button>{% endif %}
  </div>
</form>
{% endblock %}
