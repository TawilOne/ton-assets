# Запуск на сервере с доменом и автоматическим HTTPS:
#   docker compose -f docker-compose.prod.yml up -d --build
services:
  web:
    build: .
    env_file: .env
    environment:
      SESSION_COOKIE_SECURE: "1"
    volumes:
      - ctfdata:/app/data
    restart: unless-stopped

  caddy:
    image: caddy:2.8
    env_file: .env
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on: [web]
    restart: unless-stopped

volumes:
  ctfdata:
  caddy_data:
  caddy_config:
