# Песочница для бота (ставит harden.sh в /etc/systemd/system/gubkin-bot.service.d/):
# даже если через бота что-то взломают, он не сможет менять систему и читать чужие файлы.
[Service]
NoNewPrivileges=yes
PrivateTmp=yes
ProtectSystem=strict
ReadWritePaths=/opt/gubkin-bot/gubkin_schedule_bot
ProtectHome=yes
ProtectKernelTunables=yes
ProtectKernelModules=yes
ProtectKernelLogs=yes
ProtectControlGroups=yes
ProtectClock=yes
ProtectHostname=yes
RestrictSUIDSGID=yes
RestrictRealtime=yes
RestrictNamespaces=yes
LockPersonality=yes
CapabilityBoundingSet=
AmbientCapabilities=
SystemCallArchitectures=native
UMask=0077
# если бот вдруг начнёт есть память — systemd его перезапустит, а сервер не зависнет
MemoryMax=600M
