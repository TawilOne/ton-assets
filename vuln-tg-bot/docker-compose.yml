services:
  bot:
    build: .
    env_file: .env
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
    volumes:
      - botdata:/app/data
    cap_drop: [ALL]
    cap_add: [NET_RAW]
    security_opt: [no-new-privileges:true]
    mem_limit: 256m
    pids_limit: 64
volumes:
  botdata:
